<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0977ad" />
    <!-- Title, description and social tags are filled from src/content.ts at build time. -->
    <title>Michaella Gonzales</title>
    <meta name="description" content="" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Before first paint: the mode, and whether the paint reveal is needed.
      // The key matches MODE_KEY in src/lib/htmlState.ts.
      ;(function () {
        var d = document.documentElement
        d.classList.add('js')
        d.dataset.mode = 'recruiter'
        try {
          if (localStorage.getItem('mg-mode') === 'casual') d.dataset.mode = 'casual'
        } catch (e) {}
        // A link straight to a section opens the page without the paint reveal.
        if (location.hash.length > 1) d.classList.add('revealed')
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
